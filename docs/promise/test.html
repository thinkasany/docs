<script>
  // 防抖示例
const debouncedSearch = debounce2(function() {
  console.log('防抖搜索');
}, 500);
window.addEventListener('scroll', debouncedSearch);

// 节流示例

  console.log('节流行为');
}, 2000);
window.addEventListener('scroll', throttledScroll);
